<svg width="600" height="450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="450" fill="#f5ebe0"/>
  
  <!-- Table silhouette -->
  <rect x="100" y="250" width="400" height="20" rx="5" fill="#2c1810"/>
  <rect x="120" y="270" width="15" height="100" fill="#2c1810"/>
  <rect x="465" y="270" width="15" height="100" fill="#2c1810"/>
  
  <!-- Decorations on table -->
  <circle cx="180" cy="230" r="30" fill="#d4a853"/>
  <circle cx="300" cy="220" r="35" fill="#c8956c"/>
  <circle cx="420" cy="235" r="25" fill="#d4a853"/>
  
  <!-- Platters -->
  <ellipse cx="250" cy="240" rx="50" ry="15" fill="#e0b896"/>
  <ellipse cx="350" cy="245" rx="45" ry="12" fill="#e0b896"/>
  
  <!-- Small items -->
  <circle cx="200" cy="235" r="8" fill="#f5ebe0"/>
  <circle cx="230" cy="230" r="6" fill="#f5ebe0"/>
  <circle cx="320" cy="240" r="7" fill="#f5ebe0"/>
  <circle cx="360" cy="235" r="5" fill="#f5ebe0"/>
  
  <!-- Text -->
  <text x="300" y="410" text-anchor="middle" fill="#999" font-family="Arial" font-size="16">Your photo here</text>
</svg>