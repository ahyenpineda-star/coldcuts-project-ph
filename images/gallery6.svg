<svg width="600" height="450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="450" fill="#f5ebe0"/>
  
  <!-- Wooden board -->
  <rect x="100" y="120" width="400" height="250" rx="15" fill="#c8956c"/>
  <rect x="110" y="130" width="380" height="230" rx="10" fill="#e0b896"/>
  
  <!-- Cheese wheel -->
  <circle cx="200" cy="220" r="50" fill="#d4a853"/>
  <circle cx="200" cy="220" r="45" fill="#f5ebe0"/>
  <circle cx="200" cy="220" r="35" fill="#d4a853"/>
  
  <!-- Cheese wedge -->
  <path d="M350 180 L400 180 L375 230 Z" fill="#d4a853"/>
  <path d="M355 185 L395 185 L375 225 Z" fill="#f5ebe0"/>
  
  <!-- Meat slices -->
  <ellipse cx="300" cy="280" rx="30" ry="15" fill="#2c1810"/>
  <ellipse cx="300" cy="280" rx="28" ry="13" fill="#c8956c"/>
  <ellipse cx="350" cy="290" rx="25" ry="12" fill="#2c1810"/>
  <ellipse cx="350" cy="290" rx="23" ry="10" fill="#c8956c"/>
  
  <!-- Crackers -->
  <rect x="150" y="280" width="25" height="25" rx="3" fill="#d4a853"/>
  <rect x="180" y="285" width="25" height="25" rx="3" fill="#d4a853"/>
  
  <!-- Garnish -->
  <circle cx="420" cy="250" r="8" fill="#d4a853"/>
  <circle cx="410" cy="270" r="6" fill="#d4a853"/>
  
  <!-- Text -->
  <text x="300" y="410" text-anchor="middle" fill="#999" font-family="Arial" font-size="16">Your photo here</text>
</svg>